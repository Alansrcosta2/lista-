<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lista +</title>
  <style>html,body{background:#000}</style>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon.png">
</head>
<body data-theme="dark" class="splashing">

  <!-- Splash Screen -->
  <div class="splash" id="splash">
    <div class="splash-logo"><img src="icons/splash.png" alt="Lista + Logo"></div>
    <div class="splash-title">Lista +</div>
    <div class="splash-bar"><span></span></div>
    <div class="splash-foot">Carregando...</div>
  </div>

  <!-- Container Principal -->
  <div class="container">
    <header>
      <h1>?? Lista +</h1>
      <div class="header-icons">
        <button id="theme-toggle" class="icon-btn"><img src="menu-icons/lua-crescente.png" class="theme-icon"></button>
        <button id="share-btn" class="icon-btn"><img src="menu-icons/icons8-logotipo-do-whatsapp-100.png" class="share-icon"></button>
        <button id="maps-btn" class="icon-btn"><img src="menu-icons/marcador-de-localizacao.png" class="share-icon"></button>
        <button id="menu-btn" class="icon-btn"><img src="menu-icons/definicoes.png" class="share-icon"></button>
      </div>
    </header>

    <!-- Menu Dropdown -->
    <div id="header-menu" class="header-menu" style="display:none;">
      <button class="header-menu-close">&times;</button>
      <button data-action="config">Configurações</button>
      <button data-action="ajuda">Ajuda</button>
      <button data-action="apagar">Apagar Lista</button>
      <button data-action="salvar">Salvar Lista</button>
      <button data-action="abrir">Abrir Lista Salva</button>
      <button data-action="exportar">Exportar Dados</button>
      <button data-action="importar">Importar Dados</button>
      <button data-action="salvar-comprados">Salvar Comprados</button>
      <button data-action="abrir-comprados">Abrir Comprados Salvos</button>
    </div>

    <!-- Formulário Planejamento -->
    <div id="form-planejamento">
      <div class="form-grid-planejamento">
        <div class="autocomplete-container">
          <input type="text" id="nome" placeholder="Nome do produto" autocomplete="off" />
          <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
        <input type="number" id="quantidade" placeholder="Qtd" value="1" inputmode="decimal" />
        <select id="unidade-sel"><option value="">Unidade...</option></select>
        <input type="text" id="notes-planejamento" placeholder="?? Notas (opcional)" style="grid-column: 1 / -1;" />
        <div style="display:flex; gap:8px; grid-column: 1 / -1;">
          <button id="adicionar" class="verde" style="flex:1;">Adicionar à Lista</button>
          <button id="voice-add" class="amarelo" style="padding:14px; min-width:52px;">??</button>
        </div>
      </div>
      <button id="modo-mercado" class="amarelo" style="margin-top:12px; width:100%;">Ir para Mercado</button>
      
      <!-- Botões de Filtro Rápido (Planejamento) -->
      <div id="quick-filters-plan" style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
         <button id="qf-all-plan" class="config-btn">Todos</button>
         <button id="qf-kg-plan" class="config-btn">Por kg</button>
         <button id="qf-pending-plan" class="config-btn">Pendências</button>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
        <h3 style="margin:0; color:var(--text-secondary);">Lista de Planejamento</h3>
        <button id="toggle-lista" class="config-btn" style="font-size:0.85rem;">? Ocultar</button>
      </div>
      
      <!-- Botões Inferiores (Grid 2 Colunas) -->
      <div id="buttons-bar" class="buttons">
        <button id="apagar-lista" class="vermelho">Apagar Lista</button>
        <button id="salvar-lista" class="verde">Salvar Lista</button>
        <button id="abrir-listas" class="roxo">Abrir Lista Salva</button>
        <button id="exportar-dados" class="azul">Exportar Dados</button>
        <button id="importar-dados" class="amarelo">Importar Dados</button>
        <button id="abrir-comprados-salvos" class="roxo">Abrir Comprados Salvos</button>
      </div>
    </div>

    <!-- Formulário Mercado -->
    <div id="form-mercado" style="display: none;">
      <div class="form-grid-mercado">
        <div class="autocomplete-container">
          <input type="text" id="nome-mercado" placeholder="Selecione um item da lista" readonly>
        </div>
        <input type="number" id="valor-mercado" placeholder="Valor Unitário (R$)" step="0.01">
        <input type="number" id="qtd-mercado" placeholder="Qtd real" step="0.001">
        <label for="compra-kg" style="display:flex; align-items:center; gap:8px; margin:8px 0;">
          <input type="checkbox" id="compra-kg"> Comprar por kg
        </label>
        
        <button id="ver-historico-preco" class="config-btn" style="width:100%; margin-bottom:8px;">Ver histórico</button>
        <button id="adicionar-comprado" class="verde" style="width:100%; margin-bottom:8px;">Marcar como Comprado</button>
        <button id="online-search-open" class="amarelo" style="width:100%; margin-bottom:8px;">Buscar produto online</button>
        <button id="voltar-planejamento" class="roxo" style="width:100%;">Voltar para Planejamento</button>
      </div>
      
      <!-- Info Mercado -->
      <div id="info-mercado" class="info-mercado">
        <span id="total-compra">Total: R$ 0,00</span>
        <button id="editar-pendencias" class="config-btn">Editar pendências</button>
      </div>

      <!-- Filtros Mercado -->
      <div id="quick-filters" style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
        <button id="qf-all" class="config-btn">Todos</button>
        <button id="qf-kg" class="config-btn">Por kg</button>
        <button id="qf-pending" class="config-btn">Pendências</button>
      </div>
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
        <h3 style="margin:0; color:var(--text-secondary);">Lista de Planejamento</h3>
        <button id="toggle-lista-mercado" class="config-btn" style="font-size:0.85rem;">? Ocultar</button>
      </div>
    </div>

    <!-- Tabela Principal -->
    <div id="lista-wrapper" class="table-wrapper">
      <table id="lista">
        <thead><tr><th>Produto</th><th>Qtd</th><th>Kg</th><th>Preço</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Seção Comprados -->
    <div id="comprados-section" class="comprados-section" style="display:none; margin-top:18px;">
      <button id="comprados-toggle" class="section-toggle">
        <span class="toggle-label">Itens comprados</span>
        <span id="comprados-count" class="toggle-count">0</span>
        <span class="toggle-icon">?</span>
      </button>
      <div id="comprados-wrapper" class="table-wrapper" style="display:none;">
        <table id="lista-comprados">
          <thead><tr><th>Produto</th><th>Peso / Qtd</th><th>Preço</th><th>Total</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modais (Onboarding, Maps, Ajuda, Config, Listas, Share, Search, etc) -->
  <!-- (Mantendo estrutura simplificada para brevidade, mas o código real terá tudo) -->
  <div id="modal-onboarding" class="modal-overlay" style="display:none;"><div class="modal-content"><span class="modal-close" id="fechar-onboarding">&times;</span><h2>Bem-vindo</h2><button id="onboarding-next">Começar</button></div></div>
  <div id="modal-maps" class="modal-overlay" style="display:none;"><div class="modal-content"><span class="modal-close" id="fechar-maps">&times;</span><h2>Mapas</h2><div id="maps-list"></div></div></div>
  <div id="modal-config" class="modal-overlay" style="display:none;"><div class="modal-content"><span class="modal-close" id="fechar-config">&times;</span><h2>Configurações</h2><button id="btn-limpar-banco">Limpar Banco</button></div></div>
  <div id="modal-listas" class="modal-overlay" style="display:none;"><div class="modal-content"><span class="modal-close" id="fechar-listas">&times;</span><h2>Listas Salvas</h2><div id="saved-lists-container"></div></div></div>
  <div id="modal-search" class="modal-overlay" style="display:none;"><div class="modal-content"><span class="modal-close" id="search-close">&times;</span><h2>Buscar Online</h2><input id="search-input"><button id="search-btn">Buscar</button><div id="search-results"></div></div></div>
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="produtos.js"></script>
  <script src="main.clean.js"></script>
  <script src="lista-handlers.js"></script>
  <script src="free-features.js"></script>
  <script src="free-features-extra.js"></script>
  <script src="offline-mode.js"></script>
</body>
</html>
